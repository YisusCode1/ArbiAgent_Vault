services:
   api:
      build:
         context: ./server
         dockerfile: Dockerfile
      container_name: arbiagent-api
      restart: unless-stopped
      ports:
         -  "8000:8000"
      volumes:
         -  ./server:/app
      environment:
         PYTHONDONTWRITEBYTECODE: "1"
         PYTHONUNBUFFERED: "1"

   client:
      build:
         context: ./client
         dockerfile: Dockerfile
      container_name: arbiagent-client
      restart: unless-stopped
      ports:
         - "5173:5173"
      volumes:
         - ./client:/app
         - /app/node_modules
      depends_on:
         - api
